<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Duas portas, dois futuros — teste VR</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b16;color:#fff;font-family:system-ui,Arial}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;left:50%;top:9px;transform:translateX(-50%);display:flex;gap:8px;z-index:4;flex-wrap:wrap;justify-content:center}button{background:#1d263b;color:white;border:1px solid #ffad38;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700}#notice{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);text-align:center;color:#fbe6bb;background:#0a1024df;border:1px solid #53442c;border-radius:9px;padding:8px 12px;max-width:95vw;font-size:12px;pointer-events:none;z-index:3}#result{position:fixed;inset:0;background:#07101df2;z-index:6;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}#result article{max-width:580px}#result h1{color:#ffad38;font-size:clamp(28px,6vw,46px)}#result p{font-size:clamp(17px,2.6vw,23px);line-height:1.5}#result button{font-size:18px;padding:13px 20px}body.vr #ui,body.vr #notice{display:none}body.vr #result{display:none!important}</style></head><body><canvas id="scene"></canvas><div id="ui"><button id="sensor">Ativar movimento</button><button id="vr">Entrar em VR</button><button id="reset">Centralizar</button></div><div id="notice">Teste: mova o celular para mirar em uma porta. Fixe o olhar por 3 segundos. Toque na porta como alternativa.</div><div id="result"><article><h1 id="resTitle"></h1><p id="resText"></p><button id="again">Voltar às portas</button></article></div><script>
(()=>{'use strict';const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let yaw=0,pitch=0,zero=null,sensorActive=false,vr=false,chosen=null,focus=null,focusAt=0,positions=[];const TAU=Math.PI*2;let lastW=0,lastH=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;if(w!==lastW||h!==lastH){lastW=w;lastH=h;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0)}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function wrap(x){return Math.atan2(Math.sin(x),Math.cos(x))}
function rr(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function text(t,x,y,size,color='#fff',weight=700){ctx.font=`${weight} ${size}px system-ui`;ctx.fillStyle=color;ctx.textAlign='center';ctx.fillText(t,x,y)}
function panel(x,y,w,h,eye){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#121d32');g.addColorStop(.55,'#202035');g.addColorStop(1,'#0a1424');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
// HQ-style floor, horizon and ink lines
ctx.fillStyle='#252535';ctx.beginPath();ctx.moveTo(x,y+h*.70);ctx.lineTo(x+w,y+h*.70);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.fill();ctx.strokeStyle='#6e594c';ctx.lineWidth=2;for(let i=0;i<5;i++){let yy=y+h*(.71+.29*(i/5)**1.6);ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke()}
const cx=x+w/2,cy=y+h*.50;let doorRects=[];for(let i=0;i<2;i++){const angle=i===0?-.45:.45;const delta=wrap(angle-yaw);const p=delta/1.35;const dx=cx+p*w*.70;const dw=clamp(w*.22,72,230),dh=clamp(h*.54,145,420),dy=cy-dh*.33+pitch*h*.28;let visible=Math.abs(delta)<1.4;if(!visible)continue;ctx.save();ctx.translate(dx,dy);ctx.rotate(i===0?-.015:.015);ctx.fillStyle='#080b13';ctx.fillRect(-dw*.59,-dh*.64,dw*1.18,dh*1.31);rr(-dw*.52,-dh*.60,dw*1.04,dh*1.2,8,'#62452f','#f7bc64',5);rr(-dw*.42,-dh*.52,dw*.84,dh*1.04,4,i===0?'#a66c3e':'#88613e','#2a1b17',3);for(let j=-1;j<=1;j+=2){rr(j*dw*.12-dw*.12,-dh*.41,dw*.22,dh*.36,3,'#c28a51','#54341e',2);rr(j*dw*.12-dw*.12,dh*.06,dw*.22,dh*.36,3,'#b67d48','#54341e',2)}ctx.beginPath();ctx.arc(dw*.31,dh*.07,Math.max(4,dw*.028),0,TAU);ctx.fillStyle='#fcd080';ctx.fill();ctx.restore();const rw=dw*1.16,rh=dh*1.34;doorRects.push({i,x:dx-rw/2,y:dy-rh/2,w:rw,h:rh,delta});text(i===0?'PORTA 1':'PORTA 2',dx,dy+dh*.72,clamp(w*.033,13,25),'#ffe3a5',850)}
// eye target in centre of each view
const r=clamp(Math.min(w,h)*.025,11,20);ctx.strokeStyle='#f9fbff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(cx-r*1.4,cy);ctx.lineTo(cx-r*.55,cy);ctx.moveTo(cx+r*.55,cy);ctx.lineTo(cx+r*1.4,cy);ctx.moveTo(cx,cy-r*1.4);ctx.lineTo(cx,cy-r*.55);ctx.moveTo(cx,cy+r*.55);ctx.lineTo(cx,cy+r*1.4);ctx.stroke();ctx.restore();return {doorRects,cx,cy,r}}
function render(ts){resize();const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);const views=vr?2:1;positions=[];for(let e=0;e<views;e++){const px=e*w/views,ww=w/views;positions.push(panel(px,0,ww,h,e))}if(vr){ctx.fillStyle='#000';ctx.fillRect(w/2-3,0,6,h)}
// dwell selection based on target in central view, consistent across stereo eyes
let target=null;const p=positions[0];for(const d of p.doorRects){if(p.cx>=d.x&&p.cx<=d.x+d.w&&p.cy>=d.y&&p.cy<=d.y+d.h){target=d.i;break}}
if(chosen===null&&target!==null){if(focus!==target){focus=target;focusAt=ts}const progress=clamp((ts-focusAt)/3000,0,1);for(const v of positions){ctx.beginPath();ctx.arc(v.cx,v.cy,v.r*1.45,-Math.PI/2,-Math.PI/2+TAU*progress);ctx.strokeStyle='#ffb22f';ctx.lineWidth=6;ctx.stroke()}if(progress>=1)choose(target)}else{focus=null;focusAt=0}
if(chosen!==null){for(const v of positions){rr(v.cx-v.cx*.65,v.cy+v.r*2,Math.min(v.cx*1.3,320),60,12,'#0d1428dc','#ffad38',2);text(chosen===0?'TRAJETÓRIA 1':'TRAJETÓRIA 2',v.cx,v.cy+v.r*2+25,18,'#ffb84b');text('Escolha registrada!',v.cx,v.cy+v.r*2+46,13,'#fff')}}requestAnimationFrame(render)}
function choose(i){if(chosen!==null)return;chosen=i;if(!vr){document.getElementById('resTitle').textContent=`Você atravessou a porta ${i+1}`;document.getElementById('resText').textContent='Esta é a prova de funcionamento. Na próxima etapa, a porta revelará uma trajetória familiar e as oportunidades disponíveis, sem associar valor ou mérito às condições de nascimento.';document.getElementById('result').style.display='flex'}}
function onOrientation(e){if(e.alpha==null)return;const angle=(e.alpha||0)*Math.PI/180;if(zero===null)zero=angle;yaw=wrap(zero-angle);pitch=clamp((e.beta||0)*Math.PI/180-.8,-.65,.65);sensorActive=true}
document.getElementById('sensor').onclick=async()=>{try{if(typeof DeviceOrientationEvent==='undefined')throw Error('Sensor não disponível');if(typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error('Permissão negada')}window.addEventListener('deviceorientation',onOrientation,true);document.getElementById('sensor').textContent='Sensor ativado';}catch(e){alert('Não foi possível ativar o giroscópio: '+e.message+'\nUse o toque para testar.') }};
document.getElementById('vr').onclick=async()=>{vr=!vr;document.body.classList.toggle('vr',vr);document.getElementById('vr').textContent=vr?'Sair do VR':'Entrar em VR';if(vr){try{await document.documentElement.requestFullscreen?.()}catch(e){}if(screen.orientation?.lock)try{await screen.orientation.lock('landscape')}catch(e){}}else{try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}}};document.getElementById('reset').onclick=()=>{zero=null;yaw=0;pitch=0;chosen=null;focus=null};document.getElementById('again').onclick=()=>{chosen=null;focus=null;document.getElementById('result').style.display='none'};
canvas.addEventListener('click',e=>{if(chosen!==null)return;const x=e.clientX,y=e.clientY;for(const p of positions)for(const d of p.doorRects)if(x>=d.x&&x<=d.x+d.w&&y>=d.y&&y<=d.y+d.h){choose(d.i);return}});
let startX=null;canvas.addEventListener('touchstart',e=>{if(!sensorActive)startX=e.touches[0].clientX},{passive:true});canvas.addEventListener('touchmove',e=>{if(startX!==null){const x=e.touches[0].clientX;yaw=clamp(yaw-(x-startX)/innerWidth*2,-1.2,1.2);startX=x}},{passive:true});canvas.addEventListener('touchend',()=>startX=null,{passive:true});requestAnimationFrame(render);
})();</script></body></html>
